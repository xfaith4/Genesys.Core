name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester (no NuGet provider)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

          # Ensure PowerShellGet is available and modern enough
          Install-Module PowerShellGet -Scope CurrentUser -Force -AllowClobber -SkipPublisherCheck

          # Install Pester
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber

          Import-Module Pester -Force
          Get-Module Pester | Format-List Name,Version,Path

      - name: Run Pester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = . ./tests/PesterConfiguration.ps1
          Invoke-Pester -Configuration $config

  accessibility:
    name: WCAG 2.1 AA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit HTML surfaces
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Invoke-AccessibilityAudit.ps1 -JsonPath ./out/accessibility-audit.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-audit
          path: ./out/accessibility-audit.json
          if-no-files-found: ignore

  data-client:
    name: Genesys Data Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/GenesysDataClient
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/GenesysDataClient/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        # Integration tests skip themselves when no demo server is reachable.
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: genesys-data-client-dist
          path: apps/GenesysDataClient/dist
          if-no-files-found: error

  data-client-integration:
    name: Data Client against the mock server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/GenesysDataClient/package-lock.json

      - name: Mock server unit tests
        run: dotnet test tools/Genesys.MockServer/tests/Genesys.MockServer.Tests/Genesys.MockServer.Tests.csproj

      # The server only enables static hosting if dist/ exists when it starts, so build first.
      - name: Build the Data Client
        working-directory: apps/GenesysDataClient
        run: |
          npm ci
          npm run build

      - name: Install Chromium for the accessibility gate
        working-directory: apps/GenesysDataClient
        run: npx playwright install --with-deps chromium

      - name: Start mock server
        run: |
          dotnet run --project tools/Genesys.MockServer --configuration Release &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:7777/health > /dev/null; then
              echo "Mock server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Mock server did not start within 60s" >&2
          exit 1

      - name: Data Client integration tests
        working-directory: apps/GenesysDataClient
        run: npm test

      - name: WCAG 2.1 AA gate (rendered application)
        working-directory: apps/GenesysDataClient
        run: npm run test:a11y
